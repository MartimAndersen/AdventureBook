<h1>Adventure Books</h1>

@for (book of books; track book.id) {

  <mat-card class="book-card">
    <mat-card-header>
      <mat-card-title>
        {{ book.title }}
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <p>Author: {{ book.author }}</p>
      <p>Difficulty: {{ book.difficulty }}</p>
      <p>Type: {{ book.type }}</p>
    </mat-card-content>

    <mat-card-actions>
      <button mat-raised-button color="primary">
        Start New Game
      </button>
      @if (hasSavedGame(book.id)) {
        <button mat-raised-button>
          Resume Game
        </button>
      }
    </mat-card-actions>

  </mat-card>

}
